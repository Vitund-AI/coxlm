[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "coxlm"
dynamic = ["version"]  # single source: coxlm.__version__ in src/coxlm/__init__.py
description = "Typed questions in, calibrated probabilities out: one forward pass of a fine-tuned encoder."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jonathan Baker" }]
keywords = ["classification", "calibration", "structured output", "llm", "typed decisions", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
# the base install is the client (coxlm.connect) and the schema API: standard library only
dependencies = []

[project.optional-dependencies]
# run a checkpoint in-process: coxlm.load(...)
local = [
    "torch>=2.1",
    "transformers>=5.17",  # tested minimum: from_pretrained(dtype=), Qwen3.5 backbones
    "peft",                # LoRA adapter checkpoints
    "safetensors",         # release folders (model.safetensors + config.json)
    "huggingface_hub",     # coxlm.load("owner/name") from the Hugging Face Hub
]
# coxlm-serve (the server itself is standard library; it needs the model)
serve = ["coxlm[local]"]
# optional, Linux: the fast kernels for Qwen3.5 backbones (fused causal-conv1d from the Hugging Face hub, and
# flash-linear-attention's gated delta rule); without them the same answers come from slower PyTorch code
fast = ["kernels", "flash-linear-attention"]
# Apple silicon: the native MLX backend, coxlm.load(..., backend="mlx") (no torch). On Linux, mlx needs its CPU
# build for development and tests: pip install "mlx[cpu]"
mlx = [
    "mlx>=0.29",
    "mlx-lm>=0.31.3",      # its Qwen3.5 text model and gated-delta kernels
    "transformers>=5.17",  # the tokenizer only
    "safetensors",
    "huggingface_hub",
]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/Vitund-AI/coxlm"
Source = "https://github.com/Vitund-AI/coxlm"
Issues = "https://github.com/Vitund-AI/coxlm/issues"

[project.scripts]
coxlm-serve = "coxlm.serve:main"

[tool.hatch.version]
path = "src/coxlm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/coxlm"]

[tool.hatch.build.targets.sdist]
only-include = ["src/coxlm", "LICENSE", "NOTICE", "README.md", "pyproject.toml"]
exclude = ["__pycache__", "*.pyc", ".gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
